<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fictional collection service</title><style>body{font:20px/1.6 Arial;margin:40px;color:#182c34}main{max-width:700px}input,button{font:inherit;padding:12px;margin:10px 0}button{background:#18584d;color:white;border:0}small{font-size:14px}.panel{min-width:500px;padding:20px;background:#edf2f1}</style><main><small>FICTIONAL TEST SERVICE — no real booking or personal data</small><h1>Request a recycling collection</h1><div class="panel"><p>Enter the fictional postcode supplied in the test brief.</p><input id="postcode" placeholder="Postcode" autocomplete="off"><br><button id="continue">Continue</button><p id="message" role="alert"></p></div><p>This fixture deliberately includes layout and label issues for testing.</p></main><script>document.getElementById('continue').onclick=()=>{const v=document.getElementById('postcode').value;if(v!=='ZZ1 1ZZ'){document.getElementById('message').textContent='Error 42';return;}if(innerWidth<600){document.getElementById('message').textContent='The fixture cannot continue on this screen size.';return;}document.querySelector('main').innerHTML='<small>FICTIONAL TEST SERVICE</small><h1>Demo request recorded</h1><p>No real request was sent.</p>';};</script></html>
